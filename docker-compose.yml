services:
  backend:
    image: docker2309/devops-backend:latest
    container_name: devops-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env

  frontend:
    image: docker2309/devops-frontend:latest
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "80:80"